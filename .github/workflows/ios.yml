name: ios-ci

# iOS port CI (issue #121, lane ci): the ios/ branch is the integration branch for
# the SwiftUI port. MindVaultCore tests run in the Linux swift:6.3 image; the app
# target is generated with XcodeGen and built/tested on macOS runners.
on:
  push:
    branches: [ios]
  pull_request:
    branches: [ios]

concurrency:
  # Per-ref so a push to ios and package-lane PR runs don't cancel each other;
  # a new push to ios still cancels the previous push run (fast iteration).
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pure-Swift packages must build and test on Linux (CONTRACTS.md). The loop
  # covers every ios/Packages/* on the checked-out ref, so a package is
  # compiled and tested the moment it merges — no hardcoded list to forget
  # (review: the old hardcoded MindVaultCore step let package PRs go green
  # while their package was compiled nowhere). A package that cannot run on
  # Linux belongs behind a platform guard in its own manifest, not in a skip
  # list here — there is no skip list on purpose.
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Package tests (swift:6.3, every ios/Packages/*)
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(ios/Packages/*/)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "::error::No packages found under ios/Packages"; exit 1
          fi
          status=0
          for dir in "${pkgs[@]}"; do
            name=$(basename "$dir")
            echo "::group::$name (swift:6.3 on Linux)"
            if ! docker run --rm -v "$GITHUB_WORKSPACE/ios:/work" -w /work \
                 -u "$(id -u):$(id -g)" -e HOME=/tmp swift:6.3 \
                 swift test --package-path "Packages/$name"; then
              echo "::error::$name failed Linux tests"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # XcodeGen project, simulator Debug build, unit tests on an available iPhone
  # simulator, and an unsigned Release device build packaged as an artifact.
  macos-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version 2>/dev/null || true
          # Debug: which iPhone simulators exist on this runner (picked below).
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Build (iOS Simulator, Debug)
        run: >
          xcodebuild -project MindVault.xcodeproj -scheme MindVault
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO -derivedDataPath build/sim-dd build
        working-directory: ios

      - name: Pick an available iPhone simulator (by UDID, unambiguous)
        run: |
          set -euo pipefail
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
            import json, sys
            devices = json.load(sys.stdin)["devices"]
            iphones = [d for runtimes in devices.values() for d in runtimes
                       if d.get("isAvailable") and d["name"].startswith("iPhone")]
            # Prefer a booted device (reuse it), else a shut-down one.
            booted = [d for d in iphones if d["state"] == "Booted"]
            pick = booted or [d for d in iphones if d["state"] == "Shutdown"] or iphones
            if not pick:
                sys.exit("no available iPhone simulator on this runner")
            print(pick[0]["udid"])
          ')
          echo "Picked simulator UDID: $SIM_UDID"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Unit tests (MindVaultTests)
        run: >
          xcodebuild test -project MindVault.xcodeproj -scheme MindVault
          -destination "platform=iOS Simulator,id=$SIM_UDID"
          CODE_SIGNING_ALLOWED=NO -derivedDataPath build/sim-dd
          -resultBundlePath build/TestResults.xcresult
          -only-testing:MindVaultTests
        working-directory: ios

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MnemoThera-ios-test-results
          path: ios/build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Package simulator app
        run: |
          cd build/sim-dd/Build/Products/Debug-iphonesimulator
          # ditto preserves symlinks (a dynamic framework needs them); zip -r dereferences.
          ditto -c -k --sequesterRsrc --keepParent MindVault.app "$GITHUB_WORKSPACE/ios/MnemoThera-ios-sim.zip"
        working-directory: ios

      - name: Build (iOS device, Release, unsigned)
        run: >
          xcodebuild -project MindVault.xcodeproj -scheme MindVault
          -configuration Release -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO -derivedDataPath build/dd build
        working-directory: ios

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/MindVault.app Payload/
          # A failed build can leave an empty .app: fail loudly before packaging.
          test -f Payload/MindVault.app/MindVault
          # ditto preserves symlinks; a zip -r dereference breaks the first dynamic framework.
          ditto -c -k --sequesterRsrc --keepParent Payload MnemoThera-ios-unsigned.ipa
          ls -la MnemoThera-ios-unsigned.ipa MnemoThera-ios-sim.zip
        working-directory: ios

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          # Artifact names = the names ios-release.yml downloads by; the files
          # inside carry the names it publishes as release assets. Keep the
          # two in lockstep (review: silent name drift breaks the first
          # release run at the download step).
          name: MnemoThera-ios-unsigned.ipa
          path: ios/MnemoThera-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app zip
        uses: actions/upload-artifact@v4
        with:
          name: MnemoThera-ios-sim.zip
          path: ios/MnemoThera-ios-sim.zip
          if-no-files-found: error
          retention-days: 14
