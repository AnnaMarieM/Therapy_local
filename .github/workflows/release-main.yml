name: Release main

# Keeps a single rolling prerelease tagged "main" holding the latest APK from the main branch.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize runs so releases are replaced in order; never cancel a run mid-publish
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Replace the "main" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Therapy-main.apk
          # Drop the previous release and its tag so no old builds are kept
          gh release delete main --cleanup-tag --yes || true
          gh release create main Therapy-main.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "Automated build of \`main\` at ${GITHUB_SHA}. Replaced on every push to main."
