name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; a job that needs more (release-main) asks for it itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Gradle deps for the build container (mounted into it by scripts/build.sh)
      - uses: actions/cache@v4
        with:
          path: ~/.gradle-therapy-builder
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      # The same script developers run locally: lint, unit tests and the debug APK in the pinned container
      - name: Build
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            dist/Therapy-main.apk
            dist/Therapy-main-androidTest.apk
            dist/Therapy-main.apk.sha256
          retention-days: 14

  # Proves the Docker builder gives the same bytes on arm64 (aapt2 emulated) as on x86_64: same script, hashes must match.
  reproducible-arm:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: x86
      - name: Build on arm64
        run: scripts/build.sh fast
      - name: Compare with the x86_64 build
        run: |
          echo "x86_64: $(cut -d' ' -f1 x86/Therapy-main.apk.sha256)"
          echo "arm64 : $(cut -d' ' -f1 dist/Therapy-main.apk.sha256)"
          diff <(cut -d' ' -f1 x86/Therapy-main.apk.sha256) <(cut -d' ' -f1 dist/Therapy-main.apk.sha256)

  # Linux containers do not run on GitHub's Windows runners, so only the PowerShell entry point's syntax is checked here.
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/build.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-String | Write-Error; exit 1 }

  # Accepted architecture decisions (docs/AD/AD-*.md) are immutable: changing, deleting or renaming one fails the PR (AGENTS.md).
  ad-immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-ad-immutable.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

  # End-to-end tests on an emulator. Required: a failing instrumented test fails the PR.
  # The existing tests plus the CORE tier of the engine stress lab (catalogue section 5). FULL-only, LMK and SLOW tests run in the lanes below
  # and in stress-nightly.yml. Every lane leaves an artifact (logs, logcat, exit records, per-test JSON) and a job summary, also when it failed.
  android-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The same tests on a phone and on a tablet, so the two-pane layout and the size-dependent tests run on a real tablet screen too.
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_6, pixel_tablet]
    steps:
      - uses: actions/checkout@v4
      # The APKs the pinned builder produced: the tests run against exactly what gets released
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist
      # Hardware acceleration for the emulator on GitHub's Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The AVD is cached by api-target-profile-ram and made once (boot stays under 3 min on a hit)
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-${{ matrix.device }}-default
      - name: Create the AVD and its snapshot
        id: avd1
        continue-on-error: true   # the SDK download sometimes arrives corrupt ("Error on ZipFile unknown archive"): one retry below
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot generated for the cache"
      - name: Create the AVD and its snapshot (retry)
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.avd1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot generated for the cache"
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SKIP_BUILD=1 OUT_DIR=out INSTR_ARGS="-e notAnnotation com.therapylocal.app.engine.stress.FullOnly,com.therapylocal.app.engine.stress.Lmk,com.therapylocal.app.engine.stress.Slow -e lane android-test-${{ matrix.device }} -e commit ${{ github.sha }}" qa/run-device-tests.sh
      - name: Job summary
        if: always()
        run: python3 qa/stress-summary.py out/stress/results.jsonl --title "android-test (${{ matrix.device }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-android-test-${{ matrix.device }}
          path: out
          retention-days: 7
          if-no-files-found: warn

  # The FULL tier of the engine stress lab on two shards (catalogue section 5): a memory-poor phone (2 GB), real separate processes.
  # CORE tests carry both tiers and ran above, so the shards skip them.
  stress:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: stress-a, shard: 0 }
          - { lane: stress-b, shard: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-pixel_6-2048
      - name: Create the AVD and its snapshot
        id: avd1
        continue-on-error: true   # the SDK download sometimes arrives corrupt ("Error on ZipFile unknown archive"): one retry below
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot generated for the cache"
      - name: Create the AVD and its snapshot (retry)
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.avd1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot generated for the cache"
      - name: Stress tests (FULL, shard ${{ matrix.shard }} of 2)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SKIP_BUILD=1 OUT_DIR=out INSTR_ARGS="-e annotation com.therapylocal.app.engine.stress.Full -e notAnnotation com.therapylocal.app.engine.stress.Core -e numShards 2 -e shardIndex ${{ matrix.shard }} -e lane ${{ matrix.lane }} -e scale 1 -e commit ${{ github.sha }}" qa/run-device-tests.sh
      - name: Job summary
        if: always()
        run: python3 qa/stress-summary.py out/stress/results.jsonl --title "${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.lane }}
          path: out
          retention-days: 7
          if-no-files-found: warn

  # One page: every lane of this run, test by lane (ok / FAIL / skip, with the stall in ms).
  stress-report:
    needs: [android-test, stress]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stress-*
          path: lanes
        continue-on-error: true
      - run: |
          mkdir -p lanes
          python3 qa/stress-summary.py --matrix lanes >> "$GITHUB_STEP_SUMMARY"

  # Rolling "main" prerelease: only Therapy-main.apk, replaced on every push to main. Reuses the APK built above and
  # waits for unit and emulator tests, so the build runs in parallel with them. (GitHub itself adds the "Source code"
  # zip/tar.gz to every release; a workflow cannot remove them.)
  release-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android-test, stress, reproducible-arm, ad-immutable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - name: Replace the "main" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Check the APK arrived intact; the hash file itself is not published
          sha256sum -c Therapy-main.apk.sha256
          # Drop the previous release, its assets and its tag so only the newest build is kept
          gh release delete main --cleanup-tag --yes || true
          gh release create main Therapy-main.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "Latest build of main (${GITHUB_SHA::7}). Download Therapy-main.apk on your phone and open it to install."
