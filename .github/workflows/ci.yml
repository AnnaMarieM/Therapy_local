name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Gradle deps for the build container (mounted into it by scripts/build.sh)
      - uses: actions/cache@v4
        with:
          path: ~/.gradle-therapy-builder
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      # The same script developers run locally: lint, unit tests and the debug APK in the pinned container
      - name: Build
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            dist/Therapy-main.apk
            dist/Therapy-main.apk.sha256
          retention-days: 14

  # Proves the Docker builder gives the same bytes on arm64 (aapt2 emulated) as on x86_64: same script, hashes must match.
  reproducible-arm:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: x86
      - name: Build on arm64
        run: scripts/build.sh --no-test
      - name: Compare with the x86_64 build
        run: |
          echo "x86_64: $(cut -d' ' -f1 x86/Therapy-main.apk.sha256)"
          echo "arm64 : $(cut -d' ' -f1 dist/Therapy-main.apk.sha256)"
          diff <(cut -d' ' -f1 x86/Therapy-main.apk.sha256) <(cut -d' ' -f1 dist/Therapy-main.apk.sha256)

  # End-to-end tests on an emulator. Required: a failing instrumented test fails the PR.
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Hardware acceleration for the emulator on GitHub's Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: app/build/reports/androidTests/connected
          retention-days: 7

  # Rolling "main" prerelease holding the latest APK. Reuses the APK built above and
  # waits for unit and emulator tests, so the build runs in parallel with them.
  release-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android-test, reproducible-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - name: Replace the "main" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c Therapy-main.apk.sha256
          # Drop the previous release and its tag so no old builds are kept
          gh release delete main --cleanup-tag --yes || true
          gh release create main Therapy-main.apk Therapy-main.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "Automated build of \`main\` at ${GITHUB_SHA}. Replaced on every push to main."
