name: CI

# Built for wall-clock time: maximum parallelism and caching, no loss of test robustness (AD-13, docs/AD/AD-13.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; a job that needs more (release-main) asks for it itself.
permissions:
  contents: read

jobs:
  # Docs-only pull requests (nothing but docs/, log/, e2e/ and top-level Markdown, .claude/) skip the build and emulator lanes. Everything else, every
  # push to main, and any doubt (the diff cannot be read) runs the full graph. ad-immutable and powershell-syntax never depend on this job, so
  # they report on every PR; a skipped job counts as passed for branch protection.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        run: |
          code=true
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            if files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")" && [[ -n "$files" ]]; then
              if ! grep -vE '^(docs/|log/|e2e/.*\.md$|\.claude/|[^/]+\.md$|LICENSE$)' <<<"$files" >/dev/null; then code=false; fi
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The APKs, as fast as possible: the emulator lanes wait for this job only. Lint, unit tests and the release-variant checks run beside it in `build`.
  apk:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Restore only: `build` (which resolves a superset of the dependencies) saves the Gradle cache
      - uses: actions/cache/restore@v4
        with:
          path: ~/.gradle-therapy-builder
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: ./.github/actions/builder-image
      # The same script developers run locally, in the pinned container. `fast` builds exactly what `full` ships.
      - name: Build the APKs
        run: scripts/build.sh fast
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            dist/Therapy-main.apk
            dist/Therapy-main-androidTest.apk
            dist/Therapy-main.apk.sha256
          retention-days: 14

  # The QA APK (com.therapylocal.app.qa, test data, QA API; AD-16), built in parallel with `apk`. Same script, same container, same aapt2 override.
  apk-qa:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.gradle-therapy-builder
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: ./.github/actions/builder-image
      - name: Build the QA APK
        run: scripts/build.sh qa
      - uses: actions/upload-artifact@v4
        with:
          name: app-qa
          path: |
            dist/Therapy-main-qa.apk
            dist/Therapy-main-qa.apk.sha256
          retention-days: 14

  # Every pull request publishes its own QA APK as the prerelease `pr-<number>` (Therapy-pr<number>-qa.apk and its .sha256), replaced on every push
  # and deleted when the pull request closes (pr-apk-cleanup.yml). Only the QA build: it installs as com.therapylocal.app.qa beside the real app, so
  # a pull request's schema change (AD-11 wipes the database) can never reach a real vault. Published as soon as the APK is built, without
  # waiting for the tests; the pull request's checks say whether they passed. Not for forks: their token cannot write releases.
  release-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: apk-qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-qa
      - name: Replace the pull request's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          sha256sum -c Therapy-main-qa.apk.sha256
          # A run that ends after the pull request closed must not bring its release back (the cleanup has already run)
          state="$(gh pr view "$PR" --json state -q .state)"
          if [[ "$state" != OPEN ]]; then echo "#$PR is $state: nothing published"; exit 0; fi
          apk="Therapy-pr${PR}-qa.apk"
          mv Therapy-main-qa.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release delete "pr-$PR" --cleanup-tag --yes 2>/dev/null || true
          notes="QA build of pull request #${PR} at commit ${HEAD_SHA::7} (built from it merged into main, as CI tests it).

          - ${apk}: installs as com.therapylocal.app.qa next to the real app, with test data and the QA control API. Install with adb install -r.

          Replaced on every push to the pull request and deleted when it closes. Check the pull request's CI before trusting it."
          gh release create "pr-$PR" "$apk" "$apk.sha256" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "PR #${PR}: ${TITLE}" \
            --notes "$notes"

  # Lint, JVM unit tests and verifyNoFaultsInRelease (release, feel and qa carry no fault code) in the pinned container. The other half of
  # what `scripts/build.sh full` does; the APKs come from `apk`, in parallel.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Gradle deps for the build container (mounted into it by scripts/build.sh)
      - uses: actions/cache@v4
        with:
          path: ~/.gradle-therapy-builder
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: ./.github/actions/builder-image
      - name: Lint, unit tests and release checks
        run: scripts/build.sh checks
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

  # Linux containers do not run on GitHub's Windows runners, so only the PowerShell entry point's syntax is checked here.
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/build.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Out-String | Write-Error; exit 1 }

  # Accepted architecture decisions (docs/AD/AD-*.md) are immutable: changing, deleting or renaming one fails the PR (AGENTS.md).
  ad-immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-ad-immutable.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

  # The QA control API exists only in the QA build (AD-16): the wrapper refuses non-.qa packages, no other source set mentions it. The APK check is verifyNoQaApiInRelease.
  qa-api-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-qa-api-guard.sh

  # End-to-end tests on an emulator. Required: a failing instrumented test fails the PR.
  # The existing tests plus the CORE tier of the engine stress lab (catalogue section 5). FULL-only, LMK and SLOW tests run in the lanes below
  # and in stress-nightly.yml. Every lane leaves an artifact (logs, logcat, exit records, per-test JSON) and a job summary, also when it failed.
  android-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The same tests on a phone and on a tablet, each split into 3 shards (the whole run peaks at 9 emulator jobs, so two runs fit the 20-job cap), so the two-pane layout and the size-dependent tests run on a real tablet screen too.
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_6, pixel_tablet]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      # The APKs the pinned builder produced: the tests run against exactly what gets released
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist
      # KVM, then the AVD with its snapshot: cached by api-target-profile-ram, made once and saved at once (boot stays under 3 min on a hit)
      - uses: ./.github/actions/avd
        with:
          profile: ${{ matrix.device }}
          key: avd-34-google_apis-${{ matrix.device }}-default
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SKIP_BUILD=1 OUT_DIR=out INSTR_ARGS="-e notAnnotation com.therapylocal.app.engine.stress.FullOnly,com.therapylocal.app.engine.stress.Lmk,com.therapylocal.app.engine.stress.Slow -e numShards 3 -e shardIndex ${{ matrix.shard }} -e lane android-test-${{ matrix.device }}-${{ matrix.shard }} -e commit ${{ github.sha }}" qa/run-device-tests.sh
      - name: Job summary
        if: always()
        run: python3 qa/stress-summary.py out/stress/results.jsonl --title "android-test (${{ matrix.device }}, shard ${{ matrix.shard }} of 3)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-android-test-${{ matrix.device }}-${{ matrix.shard }}
          path: out
          retention-days: 7
          if-no-files-found: warn

  # ---- PR screenshots (AD-15) -------------------------------------------------------------------------------------------------------------
  # Screenshots of every screen at every window size of AdaptiveLayoutTest, on pull requests only. Beside the emulator lanes (after `apk`, nothing
  # waits for it, so the critical path is unchanged) and never a required check: both jobs are continue-on-error, and say what went wrong in their
  # job summary. The sizes are drawn on one emulator (the window override AdaptiveLayoutTest uses), split over 3 shards to keep it short.
  # The screen list is app/src/androidTest/.../screens/ScreenList.kt: a new screen is added there. To remove the feature: delete these two jobs,
  # screens/, scripts/*pr-screenshots*, pr-screenshots-cleanup.yml.
  screenshots:
    needs: apk
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist
      # The same AVD as the pixel_6 android-test lanes: restored from the cache they save
      - uses: ./.github/actions/avd
        with:
          profile: pixel_6
          key: avd-34-google_apis-pixel_6-default
      - name: Screenshot tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SKIP_BUILD=1 OUT_DIR=out INSTR_ARGS="-e class com.therapylocal.app.screens.ScreenTourTest -e screens 1 -e numShards 3 -e shardIndex ${{ matrix.shard }}" timeout 600 qa/run-device-tests.sh; qa/pull-screens.sh out/screens; adb logcat -d -s ScreenTour:I > out/screen-tour-logcat.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Screenshot tour, shard ${{ matrix.shard }} of 3"
            if [[ -f out/screens/results.tsv ]]; then
              echo "$(grep -c $'\tok\t' out/screens/results.tsv || true) captured, $(grep -c $'\tfail\t' out/screens/results.tsv || true) failed"
              grep $'\tfail\t' out/screens/results.tsv | sed 's/^/- /' || true
            else
              echo "The tour did not run (no results.tsv)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.shard }}
          path: |
            out/screens
            out/screen-tour-logcat.txt
          retention-days: 7
          if-no-files-found: warn

  # Pushes the images to the pr-screenshots branch and posts/updates the sticky comment. The only job in this file that may write: it runs only for
  # a pull request from this repository (a fork's or Dependabot's token is read-only: it is skipped with a note). It checks out the base branch's
  # scripts, not the pull request's, so a pull request cannot change what runs with the write token.
  screenshots-publish:
    needs: [changes, screenshots]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: pr-screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Can this run write?
        id: can
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$HEAD_REPO" != "${{ github.repository }}" || "$ACTOR" == "dependabot[bot]" ]]; then
            echo "Screenshots are not published for pull requests from forks or Dependabot: their token is read-only (AD-15)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "write=false" >> "$GITHUB_OUTPUT"
          else
            echo "write=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.can.outputs.write == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v4
        if: steps.can.outputs.write == 'true'
        with:
          pattern: screens-*
          path: shards
      - name: Publish
        if: steps.can.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The base branch has no scripts yet in the pull request that adds them: use the ones of the head then (same repo, so this is the author's own code).
          # (the checkout above holds only the base commit: fetch the head's first.)
          [[ -f scripts/publish-pr-screenshots.sh ]] || { git fetch -q --depth=1 origin "$HEAD_SHA" && git checkout -q "$HEAD_SHA" -- scripts/publish-pr-screenshots.sh scripts/pr-screenshots-comment.py; }
          mkdir merged
          shopt -s nullglob
          # each artifact holds screens/ (the images, manifest.tsv, results.tsv) and screen-tour-logcat.txt
          for d in shards/screens-*/screens; do
            cp -r "$d"/. merged/
          done
          # every shard wrote its own results.tsv and the same manifest.tsv: merge the results (the cp above kept only the last)
          cat shards/screens-*/screens/results.tsv > merged/results.tsv 2>/dev/null || : > merged/results.tsv
          [[ -f merged/manifest.tsv ]] || { echo "No screenshots were made (see the screenshot jobs)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          SRC="$PWD/merged" scripts/publish-pr-screenshots.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The FULL tier of the engine stress lab on three shards (catalogue section 5): a memory-poor phone (2 GB), real separate processes.
  # CORE tests carry both tiers and ran above, so the shards skip them.
  stress:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: stress-a, shard: 0 }
          - { lane: stress-b, shard: 1 }
          - { lane: stress-c, shard: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist
      - uses: ./.github/actions/avd
        with:
          profile: pixel_6
          ram-size: 2048M
          key: avd-34-google_apis-pixel_6-2048
      - name: Stress tests (FULL, shard ${{ matrix.shard }} of 3)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SKIP_BUILD=1 OUT_DIR=out INSTR_ARGS="-e annotation com.therapylocal.app.engine.stress.Full -e notAnnotation com.therapylocal.app.engine.stress.Core -e numShards 3 -e shardIndex ${{ matrix.shard }} -e lane ${{ matrix.lane }} -e scale 1 -e commit ${{ github.sha }}" qa/run-device-tests.sh
      - name: Job summary
        if: always()
        run: python3 qa/stress-summary.py out/stress/results.jsonl --title "${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.lane }}
          path: out
          retention-days: 7
          if-no-files-found: warn

  # One page: every lane of this run, test by lane (ok / FAIL / skip, with the stall in ms).
  stress-report:
    needs: [changes, android-test, stress]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stress-*
          path: lanes
        continue-on-error: true
      - run: |
          mkdir -p lanes
          python3 qa/stress-summary.py --matrix lanes >> "$GITHUB_STEP_SUMMARY"

  # Rolling "main" prerelease: Therapy-main.apk and Therapy-main-qa.apk (each with its .sha256), replaced on every push to main. Reuses the APK built above and
  # waits for unit and emulator tests, which run in parallel with each other. (GitHub itself adds the "Source code"
  # zip/tar.gz to every release; a workflow cannot remove them.)
  release-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [apk, apk-qa, build, android-test, stress, ad-immutable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - uses: actions/download-artifact@v4
        with:
          name: app-qa
      - name: Replace the "main" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Check the APK arrived intact; the hash file itself is not published
          sha256sum -c Therapy-main.apk.sha256
          sha256sum -c Therapy-main-qa.apk.sha256
          # Drop the previous release, its assets and its tag so only the newest build is kept
          gh release delete main --cleanup-tag --yes || true
          notes="Build of main at commit ${GITHUB_SHA} (${GITHUB_SHA::7}).

          - Therapy-main.apk: debug build. Installs as com.therapylocal.app, the real app's package.
          - Therapy-main-qa.apk: QA build, the test-data build. Installs as com.therapylocal.app.qa next to the real app, with the QA control API.

          Each APK has a .sha256 file."
          gh release create main Therapy-main.apk Therapy-main.apk.sha256 Therapy-main-qa.apk Therapy-main-qa.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "$notes"
