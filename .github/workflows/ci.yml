name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle deps and the build cache. PRs read the cache, runs on main write it.
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and build
        run: ./gradlew lint assembleDebug
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # End-to-end tests on an emulator. Required: a failing instrumented test fails the PR.
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Hardware acceleration for the emulator on GitHub's Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: app/build/reports/androidTests/connected
          retention-days: 7

  # Rolling "main" prerelease holding the latest APK. Reuses the APK built above and
  # waits for unit and emulator tests, so the build runs in parallel with them.
  release-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - name: Replace the "main" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk Therapy-main.apk
          # Drop the previous release and its tag so no old builds are kept
          gh release delete main --cleanup-tag --yes || true
          gh release create main Therapy-main.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "Automated build of \`main\` at ${GITHUB_SHA}. Replaced on every push to main."
