name: ASR benchmark

# Word error rate and speed of every speech model we could use, on public Czech speech (Google FLEURS cs_cz), one runner per model.
# Only public audio goes here: this repo and its runners are public, so never add real session recordings to this workflow.
# Run it from the Actions tab (workflow_dispatch), or by touching qa/asr_bench/ in a pull request.
on:
  workflow_dispatch:
    inputs:
      clips:
        description: "How many FLEURS clips to score (60 is the default; 24 is quick, 200 gives the steadiest numbers)"
        default: "60"
  pull_request:
    paths: ["qa/asr_bench/**", ".github/workflows/asr-bench.yml"]

concurrency:
  group: asr-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIPS: ${{ github.event.inputs.clips || '60' }}

jobs:
  # The test speech is built once and shared: random FLEURS clips with their reference text, cut to 16 kHz mono.
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 qa/asr_bench/fleurs.py --count "$CLIPS" --out clips
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips
          retention-days: 7

  bench:
    needs: clips
    runs-on: ubuntu-latest   # 4 vCPU on public repos: free and unlimited
    timeout-minutes: 150
    strategy:
      fail-fast: false       # one model failing must not hide the others
      matrix:
        include:
          - { id: whisper-base, engine: whisper, name: base, repo: csukuangfj/sherpa-onnx-whisper-base, files: "base-encoder.int8.onnx base-decoder.int8.onnx base-tokens.txt" }
          - { id: whisper-small, engine: whisper, name: small, repo: csukuangfj/sherpa-onnx-whisper-small, files: "small-encoder.int8.onnx small-decoder.int8.onnx small-tokens.txt" }
          - { id: whisper-medium, engine: whisper, name: medium, repo: csukuangfj/sherpa-onnx-whisper-medium, files: "medium-encoder.int8.onnx medium-decoder.int8.onnx medium-tokens.txt" }
          - { id: whisper-turbo, engine: whisper, name: turbo, repo: csukuangfj/sherpa-onnx-whisper-turbo, files: "turbo-encoder.int8.onnx turbo-decoder.int8.onnx turbo-tokens.txt" }
          - { id: whisper-large-v2, engine: whisper, name: large-v2, repo: csukuangfj/sherpa-onnx-whisper-large-v2, files: "large-v2-encoder.int8.onnx large-v2-decoder.int8.onnx large-v2-tokens.txt" }
          - { id: whisper-large-v3, engine: whisper, name: large-v3, repo: csukuangfj/sherpa-onnx-whisper-large-v3, files: "large-v3-encoder.int8.onnx large-v3-decoder.int8.onnx large-v3-tokens.txt" }
          - { id: parakeet-tdt-0.6b-v3, engine: parakeet, name: parakeet-tdt-0.6b-v3, repo: csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8, files: "encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt" }
          - { id: canary-1b-v2, engine: canary, name: canary-1b-v2, repo: fussraider/canary-1b-v2-sherpa-onnx-int8, files: "encoder.int8.onnx decoder.int8.onnx tokens.txt" }
          - { id: qwen3-asr-0.6b, engine: qwen3, name: qwen3-asr-0.6b, repo: csukuangfj2/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25, files: "conv_frontend.onnx encoder.int8.onnx decoder.int8.onnx tokenizer/merges.txt tokenizer/tokenizer_config.json tokenizer/vocab.json" }
          - { id: qwen3-asr-1.7b, engine: qwen3, name: qwen3-asr-1.7b, repo: solavr/sherpa-onnx-qwen3-asr-1.7B-int8, files: "conv_frontend.onnx encoder.int8.onnx decoder.int8.onnx decoder.int8.onnx.data tokenizer/merges.txt tokenizer/tokenizer_config.json tokenizer/vocab.json" }
          - { id: omnilingual-300m, engine: omnilingual, name: omnilingual-300m, repo: csukuangfj/sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12, files: "model.int8.onnx tokens.txt" }
          - { id: omnilingual-1b, engine: omnilingual, name: omnilingual-1b, repo: csukuangfj/sherpa-onnx-omnilingual-asr-1600-languages-1B-ctc-int8-2025-11-12, files: "model.int8.onnx tokens.txt" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/asr_bench/requirements.txt
      - run: pip install -r qa/asr_bench/requirements.txt

      # The model files are the big part (up to 1.8 GB): cached by name so a re-run does not fetch them again.
      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/${{ matrix.id }}
          key: asr-model-${{ matrix.id }}-v1

      - name: Fetch model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models/${{ matrix.id }}
          for f in ${{ matrix.files }}; do
            qa/fetch.sh "https://huggingface.co/${{ matrix.repo }}/resolve/main/$f" "models/${{ matrix.id }}/$f"
          done
          ls -la models/${{ matrix.id }}

      - uses: actions/download-artifact@v4
        with:
          name: clips
          path: clips

      - name: Score
        run: |
          python qa/asr_bench/bench.py --engine ${{ matrix.engine }} --name "${{ matrix.name }}" --language cs \
            --model-dir models/${{ matrix.id }} --clips clips --threads 4 --out results/${{ matrix.id }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: results/${{ matrix.id }}.json
          retention-days: 30

  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Table
        run: python qa/asr_bench/report.py results | tee -a "$GITHUB_STEP_SUMMARY"
