name: E2E host (corpus)

# Corpus build and scorer tests. The host Whisper run was removed with Whisper (docs/AD/AD-02.md): e2e/host/stt_host.py only drives
# Whisper, and there is no Canary host runner yet.
on:
  pull_request:
    paths:
      - "e2e/**"
      - "demo/prompts/**"
      - "app/src/main/java/com/therapylocal/app/asr/**"
      - ".github/workflows/e2e-host.yml"
  workflow_dispatch:

concurrency:
  group: e2e-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pip install -r e2e/requirements.txt
      - name: Corpus builds and is committed as built
        run: |
          python3 e2e/corpus/build.py
          git diff --exit-code -- e2e/corpus/sessions e2e/corpus/clients.json
      - name: Scorer tests
        run: python3 e2e/score/test_score.py
