name: PR screenshots cleanup

# AD-15: when a pull request closes, its images leave the pr-screenshots branch and its comment is replaced by a short note. pull_request_target,
# not pull_request: a fork's pull request gets a read-only token there, and this workflow needs to push. It runs the base branch's script and
# never checks out or runs the pull request's code; the only thing it takes from the event is the number.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: pr-screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/prune-pr-screenshots.sh
